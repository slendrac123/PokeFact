version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pokefact-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin123}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-pokefact_db}
    ports:
      - "5432:5432"
    volumes:
      - ./pokefact-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pokefact-network

  backend:
    build: ./pokefact-back
    container_name: pokefact-back
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin123}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-pokefact_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_ENV: development
      APP_DEBUG: "True"
    depends_on:
      - db
    networks:
      - pokefact-network
    restart: unless-stopped

  frontend:
    build: ./pokefact-front
    container_name: pokefact-front
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - pokefact-network
    restart: unless-stopped

networks:
  pokefact-network:
    driver: bridge