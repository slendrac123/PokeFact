version: "3.9"

services:
  backend:
    build: ./pokefact-back
    container_name: pokefact-back
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build: ./pokefact-front
    container_name: pokefact-front
    ports:
      - "5173:5173"
    env_file:
      - .env
    restart: always
    depends_on:
      - backend
